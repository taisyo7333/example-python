schemaVersion: "2.2.2"
metadata:
  name: openshift-devspaces-python-flask
  version: 1.0.1
  description: "Python environment with automatic Git repository setup for OpenShift Dev Spaces"
  displayName: Python Dev Environment
  tags:
    - Python
    - Flask
    - PostgreSQL
components:
  # Dev Tools container must be first in the list.
  - name: dev-tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.29
      memoryLimit: 4G
      memoryRequest: 1G
      cpuLimit: 2000m
      cpuRequest: 500m
      mountSources: true
      env:
        - name: DATABASE_URL
          value: postgresql://app:app@localhost:5432/appdb
      endpoints:
        - name: flask
          targetPort: 5000
          exposure: public
          protocol: http
          secure: true

  # Sidecar in the same workspace pod (reliable on Dev Spaces).
  # kubernetes+uri deployByDefault often does not apply resources.
  - name: postgres
    container:
      image: registry.redhat.io/rhel9/postgresql-15:latest
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      cpuLimit: 500m
      cpuRequest: 100m
      endpoints:
        - name: postgres
          targetPort: 5432
          exposure: none
      env:
        - name: POSTGRESQL_USER
          value: app
        - name: POSTGRESQL_PASSWORD
          value: app
        - name: POSTGRESQL_DATABASE
          value: appdb
      volumeMounts:
        - name: pgdata
          path: /var/lib/pgsql/data

  - name: pgdata
    volume:
      size: 1Gi

commands:
  - id: setup-flask-app
    exec:
      label: 01-setup-flask-app
      component: dev-tools
      workingDir: ${PROJECTS_ROOT}/example-python
      commandLine: |
        set -e
        ./scripts/setup-flask.sh
      group:
        kind: build
        isDefault: true

  - id: load-csv-data
    exec:
      label: 02-load-csv-data
      component: dev-tools
      workingDir: ${PROJECTS_ROOT}/example-python
      commandLine: |
        set -e
        ./scripts/load-csv.sh
      group:
        kind: build

  - id: run-flask-app
    exec:
      label: 03-run-flask-app
      component: dev-tools
      workingDir: ${PROJECTS_ROOT}/example-python
      commandLine: |
        set -e
        source .venv/bin/activate
        python3 main.py
      group:
        kind: run
        isDefault: true
